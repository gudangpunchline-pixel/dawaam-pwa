<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Dawaam</title>

  <!-- Google Login -->
  <script
    src="https://accounts.google.com/gsi/client"
    async
    defer>
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family: Arial, sans-serif;

      background: #681c2b;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 400px;

      background: white;

      border-radius: 24px;

      padding: 32px 24px;

      text-align: center;

      box-shadow:
        0 20px 50px
        rgba(0,0,0,.25);
    }

    .logo {
      width: 80px;
      height: 80px;

      margin: auto;
      margin-bottom: 18px;

      border-radius: 22px;

      background: #681c2b;
      color: white;

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: 48px;
    }

    h1 {
      margin: 0;
      color: #681c2b;
    }

    .desc {
      color: #777;
      margin: 10px 0 28px;
      line-height: 1.5;
    }

    #googleButton {
      display: flex;
      justify-content: center;
    }

    #status {
      margin-top: 24px;

      background: #f5f5f5;

      padding: 14px;

      border-radius: 12px;

      font-size: 14px;
    }

    #hasil {
      display: none;

      margin-top: 16px;

      padding: 14px;

      border-radius: 12px;

      background: #f5f5f5;

      text-align: left;

      white-space: pre-wrap;

      font-size: 12px;
    }
  </style>
</head>


<body>

  <div class="card">

    <div class="logo">
      د
    </div>

    <h1>
      Dawaam
    </h1>

    <div class="desc">
      Bangun kebiasaan ibadah
      secara bertahap dan konsisten.
    </div>

    <div id="googleButton"></div>

    <div id="status">
      Memuat Google Login...
    </div>

    <pre id="hasil"></pre>

  </div>


  <script>

    /* =======================================================
       CUMA 2 BARIS INI YANG PERLU KAMU GANTI
       ======================================================= */


    // GANTI INI dengan Google Client ID
    const GOOGLE_CLIENT_ID =
      '868290642922-ur59snmc9e3h7j5nb8d7p6bpthnkqgen.apps.googleusercontent.com';


    // GANTI INI dengan Web App URL Apps Script /exec
    const BACKEND_URL =
      'https://script.google.com/macros/s/AKfycbwr6N8jQ-QrrElvBhLyQZdN-HSrpjWLiPhfrAGPbYv3G88eSxjk4WdUkhf9feJgwa7b/exec';


    /* =======================================================
       JANGAN UBAH BAGIAN DI BAWAH
       ======================================================= */


    function tampilStatus(
      pesan
    ) {

      document
        .getElementById(
          'status'
        )
        .textContent =
          pesan;
    }


    async function loginBerhasil(
      response
    ) {

      try {

        tampilStatus(
          'Login Google berhasil. Menghubungkan ke Dawaam...'
        );


        const token =
          response.credential;


        const body = {

          action:
            'bootstrap',

          auth: {

            credential:
              token
          },

          payload:
            {}
        };


        const responseBackend =
          await fetch(
            BACKEND_URL,
            {

              method:
                'POST',

              headers: {

                'Content-Type':
                  'text/plain;charset=utf-8'
              },

              body:
                JSON.stringify(
                  body
                )
            }
          );


        const data =
          await responseBackend.json();


        if (
          data.ok !== true
        ) {

          throw new Error(
            data.error
              ? data.error.message
              : 'Backend menolak request.'
          );
        }


        tampilStatus(
          'Login Dawaam berhasil ✅'
        );


        const hasil =
          document.getElementById(
            'hasil'
          );


        hasil.style.display =
          'block';


        hasil.textContent =
          JSON.stringify(
            {

              user:
                data.data.user,

              route:
                data.data.route,

              onboarding:
                data.data.onboarding

            },

            null,
            2
          );


      } catch (error) {

        tampilStatus(
          'Gagal: ' +
          error.message
        );
      }
    }


    window.onload =
      function() {

        google.accounts.id.initialize({

          client_id:
            GOOGLE_CLIENT_ID,

          callback:
            loginBerhasil
        });


        google.accounts.id.renderButton(

          document.getElementById(
            'googleButton'
          ),

          {

            theme:
              'outline',

            size:
              'large',

            shape:
              'pill',

            width:
              300
          }
        );


        tampilStatus(
          'Silakan masuk dengan Google.'
        );
      };

  </script>

</body>
</html>
